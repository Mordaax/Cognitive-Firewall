[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-firewall"
version = "0.1.0"
description = "Local-first prompt-injection and PII admission control for AI agents"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "PyYAML>=6,<7",
  "cryptography>=44,<47",
  "httpx>=0.27,<1",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
full = ["mcp>=1.0,<3", "streamlit>=1.40,<2", "redis>=5,<7", "psycopg[binary]>=3.2,<4", "langgraph>=0.4,<2", "openai>=1.70,<3", "anthropic>=0.50,<1", "spacy>=3.8,<4"]
dev = ["pytest>=8,<9", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[project.scripts]
cognitive-firewall = "cognitive_firewall.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
